# Purpur versions MultiPaper can be built against.
#
# Select a version by setting "purpurVersion" in gradle.properties, e.g.:
#   purpurVersion = 26.3
#
# On a first start (after cloning the repository) you can run ./setup.sh to
# pick a version interactively; your choice is stored in gradle.properties
# (the "config"). All other values (mcVersion, version and purpurRef) are then
# derived from gradle.properties by build.gradle.kts.
#
# The "ref" values are the pinned commit of the PurpurMC/Purpur branch that the
# MultiPaper patches are applied onto. Refresh the pinned commit for the
# currently selected version with: ./gradlew purpurRefLatest
#
# "paperweight" is the paperweight patcher version Purpur itself builds with
# for that version, and "java" is the Java toolchain it targets. Both are read
# by settings.gradle.kts / build-paperweight2.gradle.kts so that each version
# uses the toolchain it was designed for.

purpur.version.list=26.3,26.2,1.21.11,26.1.2,1.20.6,1.20.1

# Purpur 26.3 (Minecraft 26.3, experimental channel)
26.3.mcVersion=26.3
26.3.apiVersion=26.3
26.3.channel=EXPERIMENTAL
26.3.branch=ver/26.3
26.3.ref=e7abd5366397249fc04051939a813d7ce6339114
26.3.paperweight=2.0.0-beta.23
26.3.java=25

