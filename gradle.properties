group = puregero.multipaper

# The Purpur version MultiPaper is built against. Choose one of the versions
# listed in purpur-versions.properties (26.3, 26.2, 1.21.11, 26.1.2, 1.20.6,
# 1.20.1). On a first start you can select this interactively with ./setup.sh,
# which writes your choice into this file. mcVersion, version and purpurRef are
# derived from this value by build.gradle.kts.
purpurVersion = 1.20.1

masterVersion = 2.12.3

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false